<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Not Found</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8f8f6;
      --text: #242424;
      --muted: #6c6c67;
      --line: #deded8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #efefea;
        --muted: #aaa9a2;
        --line: #33332f;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(100%, 520px);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 28px 0;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.35rem, 1.12rem + 1vw, 1.8rem);
      font-weight: 500;
      letter-spacing: 0;
    }

    p {
      max-width: 42rem;
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }
  </style>
</head>
<body>
  <main aria-label="Page not found">
    <h1>Not found.</h1>
    <p>The requested page is not available.</p>
  </main>
</body>
</html>
